# Publish the landing to GitHub Pages.
#
# The site is ONE self-contained file (docs/landing/index.html, five languages
# inlined, no external assets), uploaded as the artifact ROOT so the published URL
# is the repository's Pages root rather than /landing/.
#
# The landing quotes the ruleset version and digest, the field-survey figures and
# the test count. `npm test` includes test/landing.test.ts, which checks every one
# of those against the code and the docs they describe — so a stale page fails the
# job instead of going live.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/landing/**"
      - "src/**"
      - "docs/mcp-survey*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy in separate jobs so deploy-pages lists the artifact after
  # the run has registered it (same-job lookup races under Actions load).
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: docs/landing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
